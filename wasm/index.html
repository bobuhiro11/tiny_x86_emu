<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>tiny x86 emu - xv6 in your browser</title>
	<style>
		:root {
			--bg: #12141a;
			--fg: #d8dee9;
			--accent: #8fbcbb;
			--term-bg: #05070a;
			--term-fg: #d6ffd6;
		}

		body {
			margin: 0;
			padding: 2rem 1rem 3rem;
			background: var(--bg);
			color: var(--fg);
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
			line-height: 1.5;
		}

		main {
			max-width: 860px;
			margin: 0 auto;
		}

		h1 {
			font-size: 1.5rem;
			margin: 0 0 .25rem;
		}

		h1 span {
			color: var(--accent);
		}

		p.lead {
			margin: 0 0 1.5rem;
			color: #9aa5b1;
			font-size: .95rem;
		}

		#screen {
			position: relative;
			background: var(--term-bg);
			border: 1px solid #262b36;
			border-radius: 6px;
			padding: .75rem 1rem;
			height: 60vh;
			height: 60dvh;
			min-height: 380px;
			overflow: auto;
			cursor: text;
		}

		/* Invisible; it exists only to hold the caret, because a phone shows
		   its keyboard for a focused editable element and nothing else. The
		   16px font size is what stops iOS from zooming in on focus. */
		#kbd {
			position: absolute;
			width: 1px;
			height: 1px;
			padding: 0;
			border: 0;
			outline: none;
			opacity: 0;
			resize: none;
			font-size: 16px;
			pointer-events: none;
		}

		#terminal {
			margin: 0;
			display: inline;
			color: var(--term-fg);
			font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
			font-size: 14px;
			line-height: 1.35;
			white-space: pre-wrap;
			word-break: break-word;
		}

		#cursor {
			display: inline-block;
			width: .55em;
			height: 1em;
			vertical-align: text-bottom;
			background: var(--term-fg);
			animation: blink 1.1s step-end infinite;
		}

		@keyframes blink {

			0%,
			100% {
				opacity: 1;
			}

			50% {
				opacity: 0;
			}
		}

		#status {
			margin-top: .75rem;
			font-size: .85rem;
			color: #7c8794;
			display: flex;
			gap: 1rem;
			align-items: center;
			flex-wrap: wrap;
		}

		button {
			font: inherit;
			background: var(--accent);
			color: #10141a;
			border: 0;
			border-radius: 4px;
			padding: .35rem .9rem;
			cursor: pointer;
		}

		button:disabled {
			opacity: .45;
			cursor: default;
		}

		code {
			background: #1c212b;
			padding: .1rem .35rem;
			border-radius: 3px;
		}

		a {
			color: var(--accent);
		}
	</style>
</head>

<body>
	<main>
		<h1>tiny <span>x86</span> emu</h1>
		<p class="lead">
			An experimental x86 emulator written in Go, compiled to WebAssembly, booting
			<a href="https://github.com/mit-pdos/xv6-public">xv6</a> from an emulated IDE disk -
			<a id="source" href="https://github.com/bobuhiro11/tiny_x86_emu">source on GitHub</a>.
			Tap or click the screen and type: try <code>ls</code>, <code>cat README</code>, <code>echo hi</code> or
			<code>forktest</code>.
		</p>

		<div id="screen"><pre id="terminal"></pre><span id="cursor"></span><textarea id="kbd" rows="1"
				autocapitalize="none" autocomplete="off" autocorrect="off" spellcheck="false"
				aria-label="keyboard input"></textarea></div>

		<div id="status">
			<button id="runButton" disabled>Boot</button>
			<span id="state">loading emulator...</span>
		</div>
	</main>

	<script src="wasm_exec.js"></script>
	<script>
		(function () {
			const term = document.getElementById("terminal");
			const screen = document.getElementById("screen");
			const state = document.getElementById("state");
			const runButton = document.getElementById("runButton");
			const kbd = document.getElementById("kbd");

			// The guest only writes plain text, backspace, carriage return and
			// newline, so keeping the screen in a string is enough.
			let buffer = "";
			let pending = false;

			function render() {
				pending = false;
				term.textContent = buffer;
				screen.scrollTop = screen.scrollHeight;
			}

			window.emuWrite = function (s) {
				for (const ch of s) {
					if (ch === "\b") {
						buffer = buffer.slice(0, -1);
					} else if (ch !== "\r") {
						buffer += ch;
					}
				}
				if (buffer.length > 200000) { // bound the scrollback
					buffer = buffer.slice(-150000);
				}
				if (!pending) {
					pending = true;
					requestAnimationFrame(render);
				}
			};

			window.emuReady = function () {
				state.textContent = "running - tap the screen and type";
			};

			function send(s) {
				if (s !== "" && window.emuKey) {
					window.emuKey(s);
				}
			}

			function keyToBytes(ev) {
				if (ev.ctrlKey) {
					if (ev.key.length !== 1) {
						return "";
					}
					const c = ev.key.toUpperCase().charCodeAt(0);
					return (c >= 64 && c < 96) ? String.fromCharCode(c - 64) : "";
				}
				switch (ev.key) {
					case "Enter": return "\n";
					case "Backspace": return "\x7f";
					case "Tab": return "\t";
					case "Escape": return "\x1b";
					default: return ev.key.length === 1 ? ev.key : "";
				}
			}

			// A phone has no hardware keyboard, and iOS only raises the on
			// screen one for a focused editable element -- so the input sink
			// is an invisible textarea that the screen focuses when tapped.
			// Its keys arrive as input events rather than as keydown, so what
			// the guest sees is the difference between the textarea's value
			// and the padding kept in it. The padding is there so that a
			// backspace always has something to delete: iOS reports no edit
			// at all for a backspace in an already empty field.
			const PAD = "        ";
			let composing = false;
			// what the guest has already been shown of the word an Android
			// keyboard is still composing
			let sent = "";

			function resetPad() {
				kbd.value = PAD;
				try {
					kbd.setSelectionRange(PAD.length, PAD.length);
				} catch (e) { /* not every browser allows this while hidden */ }
			}

			// The text of the word being composed, i.e. everything the field
			// holds beyond its padding.
			function composed() {
				const v = kbd.value;
				return v.startsWith(PAD) ? v.slice(PAD.length) : v.replace(/^ +/, "");
			}

			// Android keyboards compose a whole word before committing it, and
			// they rewrite it as they go. Forward the change rather than the
			// word, so that characters appear as they are typed: backspace over
			// what no longer matches, then send the rest.
			function sendComposed(next) {
				let same = 0;
				while (same < sent.length && same < next.length && sent[same] === next[same]) {
					same++;
				}
				send("\x7f".repeat(sent.length - same));
				send(next.slice(same));
				sent = next;
			}

			function drainKbd() {
				const v = kbd.value;
				if (v === PAD) {
					return;
				}
				if (v.startsWith(PAD)) {
					send(v.slice(PAD.length));
				} else if (PAD.startsWith(v)) {
					send("\x7f".repeat(PAD.length - v.length)); // padding eaten
				} else {
					// autocorrect or a paste replaced the padding wholesale
					send(v.replace(/^ +/, ""));
				}
				resetPad();
			}

			kbd.addEventListener("input", function (ev) {
				if (composing || ev.isComposing) {
					sendComposed(composed()); // mid-word: do not touch the field
				} else {
					drainKbd();
				}
			});
			kbd.addEventListener("compositionstart", () => {
				composing = true;
				sent = "";
			});
			kbd.addEventListener("compositionend", () => {
				composing = false;
				sendComposed(composed()); // the keyboard may have autocorrected it
				sent = "";
				resetPad();
			});

			document.addEventListener("keydown", function (ev) {
				if (!window.emuKey || ev.metaKey || ev.altKey) {
					return;
				}
				if (document.activeElement === kbd) {
					// Printable keys, Enter and Backspace all edit the
					// textarea and come back as input events; take only the
					// keys that would never reach it.
					let s = "";
					if (ev.ctrlKey) {
						s = keyToBytes(ev);
					} else if (ev.key === "Tab") {
						s = "\t";
					} else if (ev.key === "Escape") {
						s = "\x1b";
					}
					if (s !== "") {
						ev.preventDefault();
						send(s);
					}
					return;
				}
				// Nothing is focused (a desktop browser after a click in the
				// margin): keep reading the hardware keyboard directly.
				const s = keyToBytes(ev);
				if (s !== "") {
					ev.preventDefault();
					send(s);
				}
			});

			function grabKeyboard() {
				resetPad();
				kbd.focus();
			}

			screen.addEventListener("click", function () {
				if (window.getSelection().toString() !== "") {
					return; // the tap was selecting output, not asking to type
				}
				grabKeyboard();
			});

			if (!WebAssembly.instantiateStreaming) { // polyfill
				WebAssembly.instantiateStreaming = async (resp, importObject) => {
					const source = await (await resp).arrayBuffer();
					return await WebAssembly.instantiate(source, importObject);
				};
			}

			const go = new Go();

			WebAssembly.instantiateStreaming(fetch("tiny_x86_emu.wasm"), go.importObject).then((result) => {
				boot(result.instance);
			}).catch((err) => {
				state.textContent = "failed to load the emulator: " + err;
			});

			async function boot(instance) {
				runButton.disabled = false;
				runButton.textContent = "Reboot";
				state.textContent = "booting...";
				grabKeyboard();
				await go.run(instance);
				state.textContent = "the machine stopped";
			}

			// The guest keeps its file system in memory, so a reboot is simply
			// a fresh instance of everything.
			runButton.addEventListener("click", () => window.location.reload());
		})();
	</script>
</body>

</html>
